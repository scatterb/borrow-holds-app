<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Library status</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app"></div>
<template id="setup-tpl">
  <div class="setup">
    <h1>Library status</h1>
    <p>This page shows your Vaski status from your private <b>borrow-holds</b> repository and lets you change its settings.
       It needs a GitHub access token, stored only in this browser.</p>
    <ol>
      <li>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token.</li>
      <li>Repository access: <b>Only select repositories</b> → borrow-holds.</li>
      <li>Permissions: <b>Contents: Read and write</b>, <b>Actions: Read and write</b>. Nothing else (in particular not Workflows).</li>
    </ol>
    <p class="message error" id="setup-error" style="padding:0"></p>
    <form id="setup-form">
      <label for="repo">Repository</label>
      <input id="repo" autocomplete="off" required>
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" required placeholder="github_pat_…">
      <label for="expires">Token expires on (optional)</label>
      <input id="expires" type="date">
      <p class="hint">The expiration date you picked on GitHub. The page reminds you <span id="setup-warn-days"></span> days before.</p>
      <div class="actions">
        <button class="primary" type="submit">Connect</button>
        <button type="button" id="setup-cancel">Cancel</button>
      </div>
    </form>
  </div>
</template>
<template id="toolbar-tpl">
  <div class="toolbar"><span class="status"></span>
    <button id="mags-open">Magazines</button>
    <div class="menu"><button id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
      <div class="menu-pop" id="menu" hidden><button id="run">▶ Run now</button><button id="refresh">↻ Refresh</button>
        <hr><button id="signout">Sign out</button></div></div></div>
</template>
<div class="mags" id="mags" hidden>
  <div class="mags-head">
    <input id="mags-q" type="search" placeholder="Magazine, e.g. Pelit" autocomplete="off" aria-label="Search borrowed magazines">
    <button id="mags-close">Close</button>
  </div>
  <div class="mags-body" id="mags-body"></div>
</div>
<div class="savebar" id="savebar">
  <span class="info" id="savebar-info">Unsaved changes</span>
  <button id="discard">Discard</button>
  <button id="save">Save</button>
  <button class="primary" id="save-run">Save &amp; run now</button>
</div>
</body>
</html>
