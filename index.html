<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Library status</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<style>
/* App chrome only; the status page brings its own styles. */
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1d2026; --muted: #6b7280; --line: #e5e7eb;
  --btn: #1d2026; --btn-text: #ffffff; --accent-ui: #2563eb; --danger: #c62828;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --card: #1e2126; --text: #e8eaed; --muted: #9aa0a8; --line: #2e3238;
    --btn: #e8eaed; --btn-text: #14161a; --accent-ui: #6ea2ff; --danger: #ef6b6b; }
}
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; max-width: 1500px;
  margin: 0 auto; padding: 10px 16px 0; }
.toolbar .status { margin-right: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); }
.toolbar .run { color: inherit; text-decoration: none; }
.toolbar .run.failed { color: var(--danger); font-weight: 600; }
.toolbar .run.running { color: var(--accent-ui); }
button.warn { color: var(--danger); border-color: var(--danger); }
@media (max-width: 600px) {
  .toolbar .status { flex-basis: 100%; }
  .toolbar .status:empty { display: none; }
  .toolbar button { padding: 6px 10px; }
}
button, .btn { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
button:disabled { opacity: .5; cursor: default; }
.setup { max-width: 520px; margin: 40px auto; padding: 0 16px; }
.setup label { display: block; margin: 14px 0 4px; font-weight: 600; }
.setup input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
.setup ol { padding-left: 20px; color: var(--muted); }
.setup .hint { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.setup .actions { display: flex; gap: 8px; margin-top: 18px; }
.message { max-width: 1500px; margin: 16px auto; padding: 0 16px; color: var(--muted); }
.message.error { color: var(--danger); }
/* Controls added to the status page */
.ctl-star { border: 0; background: none; padding: 0 4px 0 0; font-size: 18px; line-height: 1; color: var(--muted); vertical-align: -1px; }
.ctl-star.on { color: #e6a700; }
.ctl-return { font-size: 12px; padding: 2px 8px; border-radius: 6px; }
.ctl-return.on { background: var(--accent, var(--accent-ui)); border-color: transparent; color: #fff; }
.ctl-pause { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 2px; font-size: 13px; }
.ctl-pause input { width: 56px; font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); }
.ctl-pause .hint { color: var(--muted); }
.ctl-pause .paused { font-weight: 600; color: var(--accent, var(--accent-ui)); }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: center; gap: 8px; flex-wrap: wrap;
  align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--card);
  border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); z-index: 10; }
.savebar.show { display: flex; }
.savebar .info { color: var(--muted); margin-right: 6px; }
body.has-savebar { padding-bottom: 70px; }
/* Collapsible cards: the part above Borrowed/Reserved toggles the tables. */
.card-head { cursor: pointer; padding-bottom: 6px; -webkit-tap-highlight-color: transparent; }
.card-head .ctl-pause { cursor: auto; }
.card-head header { user-select: none; }
.card-head header:focus-visible { outline: 2px solid var(--accent, var(--accent-ui)); outline-offset: 2px; border-radius: 4px; }
.card-head h2::before { content: "▸"; display: inline-block; width: 1em; transition: transform .15s; }
.card.open .card-head h2::before { transform: rotate(90deg); }
.card:not(.open) .card-body { display: none; }
/* Magazine search: a full-screen view over the status page. */
.mags { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg); }
.mags[hidden] { display: none; }
.mags-head { position: sticky; top: 0; display: flex; gap: 8px; padding: 10px 16px; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.mags-head input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
.mags-body { max-width: 640px; margin: 0 auto; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }
.mags-body .hint { color: var(--muted); }
.mags-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mags-chips button { border-radius: 999px; }
.mag { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.mag h2 { margin: 0 0 6px; font-size: 16px; }
.mag h2 .hint { font-weight: normal; font-size: 13px; }
.mag ul { list-style: none; margin: 0; padding: 0; }
.mag li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--line); }
.mag li:first-child { border-top: 0; }
.mag .issue { font-weight: 600; font-variant-numeric: tabular-nums; }
.mag .dates { color: var(--muted); text-align: right; }
</style>
</head>
<body>
<div id="app"></div>
<div class="mags" id="mags" hidden>
  <div class="mags-head">
    <input id="mags-q" type="search" placeholder="Magazine, e.g. Pelit" autocomplete="off" aria-label="Search borrowed magazines">
    <button id="mags-close">Close</button>
  </div>
  <div class="mags-body" id="mags-body"></div>
</div>
<div class="savebar" id="savebar">
  <span class="info" id="savebar-info">Unsaved changes</span>
  <button id="discard">Discard</button>
  <button id="save">Save</button>
  <button class="primary" id="save-run">Save &amp; run now</button>
</div>
<script>
"use strict";
const WORKFLOW = "daily.yml";
const REPORT_PATH = "data/library-status.html";
const SETTINGS_PATH = "data/settings.json";
const MAGAZINES_PATH = "data/magazines.json";
const DEFAULT_REPO = "scatterb/borrow-holds";
const STALE_MS = 5 * 60 * 1000;    // refetch when the app comes back after this long
const TOKEN_WARN_DAYS = 14;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
  json(k) { try { return JSON.parse(this.get(k)); } catch { return null; } },
  setJson(k, v) { this.set(k, JSON.stringify(v)); },
};
const app = document.getElementById("app");
// base: settings.json as last read from GitHub; settings: the same with the user's edits.
let reportText = null, base = null, settings = null, settingsSha, dirty = false;
let polling = null, busy = false, loading = null, fetchedAt = 0, lastRun = null;
let magazines = null;  // data/magazines.json: {updated, issues: [{name, title, issue, borrowed, record}]}

// ---------- GitHub API ----------
function cfg() { return { repo: store.get("repo"), token: store.get("token") }; }

async function gh(path, opts = {}) {
  const { repo, token } = cfg();
  const res = await fetch(`https://api.github.com/repos/${repo}${path}`, {
    ...opts,
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
    cache: "no-store",
  });
  if (!res.ok && res.status !== 404) {
    const msg = (await res.json().catch(() => ({}))).message || res.statusText;
    throw new Error(`GitHub ${res.status}: ${msg}`);
  }
  return res;
}

const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const b64encode = s => { let bin = ""; new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };

async function getFile(path) {
  const res = await gh(`/contents/${path}?ref=main`);
  if (res.status === 404) return null;
  const j = await res.json();
  return { text: b64decode(j.content), sha: j.sha };
}

async function getLastRun() {
  const res = await gh(`/actions/workflows/${WORKFLOW}/runs?per_page=1`);
  return res.status === 404 ? null : (await res.json()).workflow_runs?.[0] || null;
}

// Returns true when the file had changed on GitHub and our edits were merged onto the newer version.
async function putSettings() {
  const send = () => gh(`/contents/${SETTINGS_PATH}`, { method: "PUT", body: JSON.stringify({
    message: "Update settings from phone app", content: b64encode(JSON.stringify(settings, null, 2) + "\n"),
    branch: "main", ...(settingsSha ? { sha: settingsSha } : {}) }) });
  let res, merged = false;
  try { res = await send(); }
  catch (e) {
    // Someone (e.g. the daily run) changed the file meanwhile: apply our edits on top of the latest version.
    if (!/GitHub 409|GitHub 422/.test(e.message)) throw e;
    const latest = await getFile(SETTINGS_PATH), remote = parseSettings(latest?.text);
    settings = mergeSettings(base, settings, remote);
    base = remote; settingsSha = latest?.sha; merged = true;
    res = await send();
  }
  settingsSha = (await res.json()).content.sha;
  return merged;
}

// ---------- settings ----------
const defaultSettings = () => ({ priority: {}, returning: [], paused_until: {} });
const parseSettings = text => Object.assign(defaultSettings(), text ? JSON.parse(text) : {});
const clone = o => JSON.parse(JSON.stringify(o));
const keysOf = (...objs) => new Set(objs.flatMap(o => Object.keys(o || {})));

// Three-way merge: apply the edits that turned `from` into `to` on top of `onto`.
function mergeSettings(from, to, onto) {
  const out = clone(onto);
  const mergeList = (a = [], b = [], c = []) => {
    const removed = a.filter(x => !b.includes(x));
    return [...c.filter(x => !removed.includes(x)), ...b.filter(x => !a.includes(x) && !c.includes(x))];
  };
  out.returning = mergeList(from.returning, to.returning, onto.returning);
  for (const cat of keysOf(from.priority, to.priority, onto.priority)) {
    const list = mergeList(from.priority[cat], to.priority[cat], onto.priority[cat]);
    list.length ? out.priority[cat] = list : delete out.priority[cat];
  }
  for (const cat of keysOf(from.paused_until, to.paused_until)) {
    const until = to.paused_until[cat];
    if (until === from.paused_until[cat]) continue;
    until ? out.paused_until[cat] = until : delete out.paused_until[cat];
  }
  for (const k of Object.keys(to))
    if (!(k in defaultSettings()) && JSON.stringify(from[k]) !== JSON.stringify(to[k])) out[k] = clone(to[k]);
  return out;
}

// Unsaved edits as short phrases, e.g. ["2 starred", "1 returning"].
function changeSummary() {
  if (!base || !settings) return [];
  const diff = (a = [], b = []) => [b.filter(x => !a.includes(x)).length, a.filter(x => !b.includes(x)).length];
  let starred = 0, unstarred = 0, paused = 0, unpaused = 0;
  for (const cat of keysOf(base.priority, settings.priority)) {
    const [add, rem] = diff(base.priority[cat], settings.priority[cat]);
    starred += add; unstarred += rem;
  }
  const [returning, notReturning] = diff(base.returning, settings.returning);
  for (const cat of keysOf(base.paused_until, settings.paused_until)) {
    const until = settings.paused_until[cat];
    if (until !== base.paused_until[cat]) until ? paused++ : unpaused++;
  }
  return [[starred, "starred"], [unstarred, "unstarred"], [returning, "returning"], [notReturning, "not returning"],
          [paused, paused === 1 ? "pause" : "pauses"], [unpaused, unpaused === 1 ? "pause removed" : "pauses removed"]]
    .filter(([n]) => n).map(([n, text]) => `${n} ${text}`);
}

// ---------- dates ----------
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fi = d => `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysFrom = (a, b) => Math.round((b - a) / 86400000);
function when(t) {
  const d = new Date(t), day = new Date(d); day.setHours(0, 0, 0, 0);
  const ago = daysFrom(day, today());
  return `${ago === 0 ? "today" : ago === 1 ? "yesterday" : `${d.getDate()}.${d.getMonth() + 1}.`} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ---------- views ----------
function setupView(error) {
  stopPolling();
  fetchedAt = 0;
  bar.classList.remove("show");
  document.body.classList.remove("has-savebar");
  const hasToken = !!store.get("token");
  app.innerHTML = `
  <div class="setup">
    <h1>Library status</h1>
    <p>This page shows your Vaski status from your private <b>borrow-holds</b> repository and lets you change its settings.
       It needs a GitHub access token, stored only in this browser.</p>
    <ol>
      <li>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token.</li>
      <li>Repository access: <b>Only select repositories</b> → borrow-holds.</li>
      <li>Permissions: <b>Contents: Read and write</b>, <b>Actions: Read and write</b>. Nothing else (in particular not Workflows).</li>
    </ol>
    ${error ? `<p class="message error" style="padding:0">${escapeHtml(error)}</p>` : ""}
    <form id="setup-form">
      <label for="repo">Repository</label>
      <input id="repo" value="${escapeHtml(store.get("repo") || DEFAULT_REPO)}" autocomplete="off" required>
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" required placeholder="github_pat_…">
      <label for="expires">Token expires on (optional)</label>
      <input id="expires" type="date" value="${escapeHtml(store.get("tokenExpires") || "")}">
      <p class="hint">The expiration date you picked on GitHub. The page reminds you ${TOKEN_WARN_DAYS} days before.</p>
      <div class="actions">
        <button class="primary" type="submit">Connect</button>
        ${hasToken ? `<button type="button" id="setup-cancel">Cancel</button>` : ""}
      </div>
    </form>
  </div>`;
  document.getElementById("setup-form").onsubmit = e => {
    e.preventDefault();
    store.set("repo", document.getElementById("repo").value.trim());
    store.set("token", document.getElementById("token").value.trim());
    const expires = document.getElementById("expires").value;
    expires ? store.set("tokenExpires", expires) : store.del("tokenExpires");
    // Start over from the cache and draft of this repository.
    reportText = base = settings = null;
    load();
  };
  if (hasToken) document.getElementById("setup-cancel").onclick = () => load();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function statusHtml() {
  let html = "";
  if (polling) html += `<span class="run running">Run in progress…</span>`;
  else if (lastRun) {
    const done = lastRun.status === "completed", ok = lastRun.conclusion === "success";
    html += `<a class="run${done && !ok ? " failed" : ""}" href="${escapeHtml(lastRun.html_url)}" target="_blank" rel="noopener"
      title="${done ? escapeHtml(lastRun.conclusion) : "running"}">Last run ${when(lastRun.created_at)} ${!done ? "…" : ok ? "✓" : "✗"}</a>`;
  }
  const expires = store.get("tokenExpires");
  if (expires) {
    const days = daysFrom(today(), parseIso(expires));
    if (days <= TOKEN_WARN_DAYS)
      html += `<button class="warn" id="renew">${days < 0 ? "Token expired" : days === 0 ? "Token expires today" : `Token expires in ${days} d`}</button>`;
  }
  return html;
}

function toolbar() {
  return `<div class="toolbar"><span class="status">${statusHtml()}</span>
    <button id="toggle-all" hidden></button><button id="mags-open">Magazines</button><button id="run">▶ Run</button>
    <button id="refresh">↻ Refresh</button><button id="signout">Sign out</button></div>`;
}

function bindToolbar() {
  document.getElementById("refresh").onclick = () => load();
  document.getElementById("mags-open").onclick = () => openMagazines();
  document.getElementById("signout").onclick = () => {
    if (!confirm("Remove the access token and the saved copy from this browser?" + (dirty ? " Unsaved changes are lost." : ""))) return;
    for (const k of ["token", "cache", "draft"]) store.del(k);
    reportText = base = settings = lastRun = magazines = null;
    setDirty(false);
    navigator.clearAppBadge?.().catch(() => {});
    setupView();
  };
  document.getElementById("run").onclick = () => dirty
    ? withBusy(async () => { await save(); await runNow(); })
    : runNow().catch(e => notify(e.message, true));
  document.getElementById("toggle-all").onclick = () => {
    const cards = collapsibleCards(), open = !cards.every(c => c.classList.contains("open"));
    cards.forEach(c => setCardOpen(c, open));
  };
  paintStatus();
}

function paintStatus() {
  const status = app.querySelector(".toolbar .status");
  if (!status) return;
  status.innerHTML = statusHtml();
  const renew = document.getElementById("renew");
  if (renew) renew.onclick = () => (!dirty || confirm("Unsaved changes stay as a draft. Continue?")) && setupView();
  document.getElementById("run").disabled = !!polling;
}

function load() {
  if (!loading) loading = fetchAll().finally(() => loading = null);
  return loading;
}

async function fetchAll() {
  const { repo, token } = cfg();
  if (!repo || !token) return setupView();
  const draft = store.json("draft");
  if (reportText === null) {
    // First load: show the saved copy (with any unsaved draft) right away, then update it.
    const cache = store.json("cache");
    if (cache?.repo === repo && cache.report) {
      base = parseSettings(cache.settings);
      magazines = parseMagazines(cache.magazines);
      settings = draft?.repo === repo ? mergeSettings(draft.base, draft.settings, base) : clone(base);
      renderReport(cache.report);
      changed();
      notify(`Showing the copy from ${when(cache.at)}. Updating…`);
    } else app.innerHTML = `<p class="message">Loading…</p>`;
  }
  try {
    const [report, settingsFile, run, magazinesFile] = await Promise.all([
      getFile(REPORT_PATH), getFile(SETTINGS_PATH), getLastRun().catch(() => lastRun),
      getFile(MAGAZINES_PATH).catch(() => undefined)]);
    const remote = parseSettings(settingsFile?.text);
    // Keep edits made so far (on this page or in a draft from an earlier visit) on top of the latest settings.
    const [from, to] = base && settings ? [base, settings]
      : draft?.repo === repo ? [draft.base, draft.settings] : [remote, remote];
    settings = mergeSettings(from, to, remote);
    base = remote;
    settingsSha = settingsFile?.sha;
    lastRun = run;
    if (magazinesFile !== undefined) magazines = parseMagazines(magazinesFile?.text);  // keep the old copy on errors
    fetchedAt = Date.now();
    store.setJson("cache", { repo, report: report?.text ?? null, settings: settingsFile?.text ?? null,
                             magazines: magazines && JSON.stringify(magazines), at: fetchedAt });
    renderMagazines();
    if (!report) {
      reportText = "";
      app.innerHTML = toolbar() + `<p class="message">No status page yet. It appears after the next daily run, or start one with “Run”.</p>`;
      bindToolbar();
    } else renderReport(report.text);
    changed();
    if (!polling && lastRun && lastRun.status !== "completed") {
      const id = lastRun.id;
      pollRun(async () => (await gh(`/actions/runs/${id}`)).json());
    }
  } catch (e) {
    if (/GitHub 401|GitHub 403/.test(e.message)) return setupView("The token was not accepted: " + e.message);
    if (reportText) return notify(`Couldn't update: ${e.message}`, true);
    app.innerHTML = toolbar() + `<p class="message error">${escapeHtml(e.message)}</p>`;
    bindToolbar();
  }
}

function renderReport(htmlText) {
  reportText = htmlText;
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  let style = document.getElementById("report-style");
  if (!style) { style = document.createElement("style"); style.id = "report-style"; document.head.prepend(style); }
  style.textContent = [...doc.querySelectorAll("style")].map(s => s.textContent).join("\n");
  app.innerHTML = toolbar() + (doc.querySelector("main")?.outerHTML || "");
  bindToolbar();
  enhance();
  makeCollapsible();
  updateBadge();
}

// Number of things to pick up or return soon on the home screen icon, where supported.
function updateBadge() {
  if (!navigator.setAppBadge) return;
  const n = app.querySelectorAll(".attention .pickup-item, .attention .due-item").length;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

// Cards start closed; remember which ones were opened, also across visits.
const openCards = new Set(store.json("openCards") || []);
const collapsibleCards = () => [...app.querySelectorAll("section.card")].filter(c => c.querySelector(".card-head"));

function setCardOpen(card, open) {
  card.classList.toggle("open", open);
  card.querySelector("header").setAttribute("aria-expanded", open);
  open ? openCards.add(card.dataset.cat) : openCards.delete(card.dataset.cat);
  store.setJson("openCards", [...openCards]);
  const all = document.getElementById("toggle-all");
  if (all) all.textContent = collapsibleCards().every(c => c.classList.contains("open")) ? "Close all" : "Open all";
}

function makeCollapsible() {
  for (const card of app.querySelectorAll("section.card")) {
    if (!card.querySelector(":scope > h3")) continue;
    const header = card.querySelector("header");
    const head = document.createElement("div"), body = document.createElement("div");
    head.className = "card-head"; body.className = "card-body";
    let inBody = false;
    for (const el of [...card.children]) {
      if (el.tagName === "H3") inBody = true;
      (inBody ? body : head).append(el);
    }
    card.append(head, body);
    header.setAttribute("role", "button");
    header.tabIndex = 0;
    const toggle = () => setCardOpen(card, !card.classList.contains("open"));
    setCardOpen(card, openCards.has(card.dataset.cat));
    head.onclick = e => { if (!e.target.closest("button, input, a")) toggle(); };
    header.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  }
  document.getElementById("toggle-all").hidden = !collapsibleCards().length;
}

// ---------- controls on the status page ----------
function enhance() {
  const t = today();
  for (const card of app.querySelectorAll("section.card[data-managed='1']")) {
    const cat = card.dataset.cat;

    // Prioritise (star) reservations.
    for (const row of card.querySelectorAll("tr.hold[data-key]")) {
      const key = row.dataset.key;
      if (!key) continue;
      row.querySelector(".star")?.remove();
      const btn = document.createElement("button");
      btn.className = "ctl-star";
      btn.title = "Prioritise: comes first in this format's queue";
      const paint = () => {
        const on = (settings.priority[cat] || []).includes(key);
        btn.classList.toggle("on", on);
        btn.textContent = on ? "★" : "☆";
        btn.setAttribute("aria-pressed", on);
      };
      btn.onclick = () => {
        const list = settings.priority[cat] || (settings.priority[cat] = []);
        const i = list.indexOf(key);
        i >= 0 ? list.splice(i, 1) : list.push(key);
        paint(); changed();
      };
      paint();
      row.querySelector("td.title").prepend(btn);
    }

    // Mark loans as returning.
    for (const row of card.querySelectorAll("tr.loan[data-record]")) {
      const id = row.dataset.record;
      if (!id) continue;
      const cell = row.querySelector("td.badges");
      cell.querySelector(".badge.info")?.remove();
      cell.classList.remove("empty");
      const btn = document.createElement("button");
      btn.className = "ctl-return";
      btn.title = "Done with it: release the next one in this format now";
      const paint = () => {
        const on = settings.returning.includes(id);
        btn.classList.toggle("on", on);
        btn.textContent = on ? "Returning ✓" : "Done";
      };
      btn.onclick = () => {
        const i = settings.returning.indexOf(id);
        i >= 0 ? settings.returning.splice(i, 1) : settings.returning.push(id);
        paint(); changed();
      };
      paint();
      cell.prepend(btn);
    }

    // Pause the whole format for N days.
    const box = document.createElement("div");
    box.className = "ctl-pause";
    const release = parseIso(card.dataset.release || iso(t));
    const paintPause = () => {
      const until = settings.paused_until[cat];
      if (until && parseIso(until) >= t) {
        box.innerHTML = `<span class="paused">Paused by you until ${fi(parseIso(until))}</span> <button class="ctl-clear">Remove pause</button>`;
        box.querySelector(".ctl-clear").onclick = () => { delete settings.paused_until[cat]; paintPause(); changed(); };
      } else {
        box.innerHTML = `Busy with something of my own: move everything
          <input type="number" min="1" max="365" value="14" inputmode="numeric" aria-label="days"> days later
          <button class="ctl-apply">Pause</button> <span class="hint"></span>`;
        const input = box.querySelector("input"), hint = box.querySelector(".hint");
        const target = () => addDays(release > t ? release : t, Math.max(1, parseInt(input.value, 10) || 0));
        const showHint = () => hint.textContent = `→ nothing new before ${fi(target())}`;
        input.oninput = showHint; showHint();
        box.querySelector(".ctl-apply").onclick = () => { settings.paused_until[cat] = iso(target()); paintPause(); changed(); };
      }
    };
    paintPause();
    (card.querySelector(".release") || card.querySelector("header")).after(box);
  }
}

// Drop settings that no longer match anything on the page (returned loans, collected holds, past pauses).
function pruneSettings() {
  const t = iso(today());
  const loanIds = new Set([...app.querySelectorAll("tr.loan[data-record]")].map(r => r.dataset.record));
  const holdKeys = new Set([...app.querySelectorAll("tr.hold[data-key]")].map(r => r.dataset.key));
  settings.returning = settings.returning.filter(id => loanIds.has(id));
  for (const cat of Object.keys(settings.priority)) {
    settings.priority[cat] = settings.priority[cat].filter(k => holdKeys.has(k));
    if (!settings.priority[cat].length) delete settings.priority[cat];
  }
  for (const [cat, until] of Object.entries(settings.paused_until)) if (until < t) delete settings.paused_until[cat];
}

// ---------- magazine search ----------
const magsView = document.getElementById("mags"), magsQuery = document.getElementById("mags-q");
const magsBody = document.getElementById("mags-body");
const parseMagazines = text => { try { return text ? JSON.parse(text) : null; } catch { return null; } };
// Case and accent insensitive: "skona" finds "Sköna hem".
const fold = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
// "2026:17" -> [2026, 17]; double issues like "2026:3-4" sort by their first number.
const issueKey = issue => (issue || "").split(":").map(n => parseInt(n, 10) || 0);
const newerIssue = (a, b) => { const [x, y] = [issueKey(a), issueKey(b)]; return (y[0] - x[0]) || ((y[1] || 0) - (x[1] || 0)); };

// The Android back button closes the view instead of leaving the app.
function openMagazines() {
  if (magsView.hidden) history.pushState({ mags: 1 }, "");
  magsView.hidden = false;
  document.body.style.overflow = "hidden";
  renderMagazines();
  magsQuery.focus();
  magsQuery.select();
}
function hideMagazines() {
  magsView.hidden = true;
  document.body.style.overflow = "";
}
document.getElementById("mags-close").onclick = () => history.state?.mags ? history.back() : hideMagazines();
window.addEventListener("popstate", () => { if (!magsView.hidden) hideMagazines(); });
magsQuery.oninput = () => renderMagazines();

function renderMagazines() {
  if (magsView.hidden) return;
  const issues = magazines?.issues || [];
  if (!issues.length) {
    magsBody.innerHTML = `<p class="hint">No magazine loans yet. They appear after the next daily run, or start one with “Run”.</p>`;
    return;
  }
  // Issues are newest borrowed first, so names come out most recently borrowed first.
  const byName = new Map();
  for (const e of issues) {
    if (!byName.has(e.name)) byName.set(e.name, []);
    byName.get(e.name).push(e);
  }
  const updated = magazines.updated ? `Loans up to ${fi(parseIso(magazines.updated))}.` : "";
  const q = fold(magsQuery.value.trim());
  if (!q) {
    magsBody.innerHTML = `<p class="hint">Type a name, or pick one. ${updated}</p><div class="mags-chips">${
      [...byName.keys()].map(n => `<button data-name="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join("")}</div>`;
    for (const b of magsBody.querySelectorAll("[data-name]"))
      b.onclick = () => { magsQuery.value = b.dataset.name; renderMagazines(); };
    return;
  }
  const hits = [...byName].filter(([name, list]) => fold(name).includes(q) || list.some(e => fold(e.title).includes(q)));
  magsBody.innerHTML = (hits.length ? hits.map(([name, list]) => {
    // One line per issue, newest issue first, with every date it was borrowed.
    const dates = new Map();
    for (const e of list) dates.set(e.issue, [...(dates.get(e.issue) || []), fi(parseIso(e.borrowed))]);
    const rows = [...dates].sort(([a], [b]) => newerIssue(a, b)).map(([issue, ds]) =>
      `<li><span class="issue">${escapeHtml(issue ? issue.replace(":", " : ") : "?")}</span>
           <span class="dates">${ds.map(escapeHtml).join(", ")}</span></li>`).join("");
    return `<section class="mag"><h2>${escapeHtml(name)} <span class="hint">${dates.size} issue${dates.size === 1 ? "" : "s"}</span></h2>
      <ul>${rows}</ul></section>`;
  }).join("") : `<p class="hint">No borrowed magazine matches “${escapeHtml(magsQuery.value.trim())}”.</p>`)
    + `<p class="hint">${updated}</p>`;
}

// ---------- saving & running ----------
const bar = document.getElementById("savebar"), barInfo = document.getElementById("savebar-info");
function setDirty(on) {
  dirty = on;
  bar.classList.toggle("show", on);
  document.body.classList.toggle("has-savebar", on);
}

// Call after every edit: updates the save bar and keeps unsaved edits as a draft in case the app is closed.
function changed() {
  const summary = changeSummary();
  setDirty(summary.length > 0);
  barInfo.textContent = summary.join(" · ");
  dirty ? store.setJson("draft", { repo: cfg().repo, base, settings }) : store.del("draft");
}

async function save() {
  pruneSettings();
  const merged = await putSettings();
  base = clone(settings);
  const cache = store.json("cache");
  if (cache) store.setJson("cache", { ...cache, settings: JSON.stringify(settings) });
  if (merged) renderReport(reportText);
  changed();
}

async function runNow() {
  const res = await gh(`/actions/workflows/${WORKFLOW}/dispatches`, { method: "POST",
    body: JSON.stringify({ ref: "main", inputs: { apply: "true" } }) });
  if (res.status === 404) throw new Error("Workflow not found (is the token allowed to use Actions?)");
  const startedAt = Date.now();
  pollRun(async () => {
    const runs = await (await gh(`/actions/workflows/${WORKFLOW}/runs?per_page=1&event=workflow_dispatch`)).json();
    const run = runs.workflow_runs?.[0];
    return run && Date.parse(run.created_at) >= startedAt - 60000 ? run : null;
  });
  notify("Run started. The page refreshes when it has finished (about 1–2 minutes).");
}

function notify(text, isError) {
  const bar = app.querySelector(".toolbar");
  if (!bar) return;
  let el = document.getElementById("notice");
  if (!el) { el = document.createElement("p"); el.id = "notice"; bar.after(el); }
  el.className = "message" + (isError ? " error" : "");
  el.textContent = text;
}

// Waits for the run that getRun() returns (null until it exists) to finish, then reloads.
function pollRun(getRun) {
  clearInterval(polling);
  let tries = 0;
  polling = setInterval(async () => {
    try {
      tries++;
      const run = await getRun();
      if (run?.status === "completed") {
        stopPolling();
        lastRun = run;
        await load();
        if (run.conclusion !== "success") notify(`The run finished with “${run.conclusion}”. Open GitHub Actions for details.`, true);
      } else if (tries > 40) {
        stopPolling();
        notify("The run is taking long. Refresh later.");
      }
    } catch (e) { stopPolling(); notify(e.message, true); }
  }, 8000);
  paintStatus();
}

function stopPolling() {
  clearInterval(polling);
  polling = null;
  paintStatus();
}

async function withBusy(fn) {
  const buttons = bar.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  barInfo.textContent = "Saving…";
  busy = true;
  try { await fn(); }
  catch (e) { dirty ? barInfo.textContent = "Failed: " + e.message : notify(e.message, true); }
  finally { busy = false; buttons.forEach(b => b.disabled = false); }
}
document.getElementById("save").onclick = () => withBusy(async () => {
  await save(); notify("Saved. The next daily run uses these settings.");
});
document.getElementById("save-run").onclick = () => withBusy(async () => { await save(); await runNow(); });
document.getElementById("discard").onclick = () => {
  if (!confirm("Discard unsaved changes?")) return;
  settings = clone(base);
  renderReport(reportText);
  changed();
};

// Phones keep the app open in the background for days: update when it comes back.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && fetchedAt && !busy && Date.now() - fetchedAt > STALE_MS) load();
});

// Shortcuts on the home screen icon: "Run now" opens ?run=1, "Magazines" ?mags=1.
const params = new URLSearchParams(location.search), runOnOpen = params.has("run");
if (runOnOpen || params.has("mags")) history.replaceState(null, "", location.pathname);
const magsOnOpen = params.has("mags");
load().then(() => {
  if (magsOnOpen && store.get("token")) openMagazines();
  if (runOnOpen && fetchedAt && !polling) runNow().catch(e => notify(e.message, true));
});
</script>
